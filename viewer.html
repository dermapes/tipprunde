<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tipprunde</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#0F1417;--elev:#151B1F;--card:#1A2126;--line:#2A343B;--text:#EEF1F0;--muted:#8B9AA3;--accent:#FFB238;--win:#3FA35A;--loss:#E4572E;--void:#B08D57}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}#app{max-width:1100px;margin:auto;padding:20px 16px 80px}.scoreboard{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px;flex-wrap:wrap}h1{font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0}.sub,.status-line,.bet-desc{font-size:13px;color:var(--muted)}.tabs{display:flex;gap:6px;background:var(--elev);border:1px solid var(--line);border-radius:999px;padding:4px}.tab{padding:7px 16px;border-radius:999px;border:0;background:transparent;color:var(--muted);font-weight:bold;cursor:pointer}.tab.active{background:var(--accent);color:#1a1305}.md-nav{display:flex;gap:14px;align-items:center;margin-bottom:20px}.md-nav select{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 12px}.game,.summary,.table-wrap{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}.game-head{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}.rank-badge{font-family:monospace;font-size:11px;color:var(--muted);background:var(--elev);border:1px solid var(--line);border-radius:6px;padding:3px 7px}.teams{display:flex;gap:8px;flex:1;min-width:200px;font-size:15px;font-weight:600}.vs{color:var(--muted)}.player-chip{background:#4A3A1C;color:var(--accent);border-radius:999px;padding:5px 12px;font-weight:bold;font-size:13px}.game-body{padding:14px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.score-disp{font-family:monospace;font-size:20px;font-weight:bold}.result-pill{font-weight:bold;border-radius:8px;padding:8px 14px;text-align:center;min-width:125px}.result-pending{background:var(--elev);color:var(--muted);border:1px dashed var(--line)}.result-win{background:#16281C;color:var(--win)}.result-loss{background:#2C1913;color:var(--loss)}.result-voided{background:#2B241A;color:var(--void)}.summary{padding:14px}.summary h3{margin:0 0 10px;font-size:13px;color:var(--muted);text-transform:uppercase}.summary-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}.summary-item{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px}.name{font-size:12px;color:var(--muted)}.val{font-family:monospace;font-weight:bold;font-size:16px;margin-top:2px}.pos{color:var(--win)}.neg{color:var(--loss)}.zero{color:var(--muted)}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:9px 12px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}th{background:var(--elev);color:var(--muted);text-transform:uppercase;font-size:11px}td.player-name{text-align:left;font-weight:bold}.error-box{padding:16px;background:#2C1913;border:1px solid var(--loss);border-radius:10px}
</style></head><body><div id="app">Lädt…</div><script>
const DATA_URL='./data.json',STAKE=2,BASE_ORDER=['Tino','Spani','Muc','Julian','Malte','Markus','Michi','Thomas'];let state=null,currentTab='matchday',currentMdIndex=0;
const BET_TYPES={'1x2':'1X2','dc':'Doppelte Chance','ou':'Über/Unter','btts':'Beide treffen','hc':'Handicap','htft':'HZ/Endstand','free':'Freitext','wuo':'Wette'};
const SEASON_BET_TYPES={'meister':'Deutscher Meister','top4':'Top 4','top6':'Top 6','top10':'Top 10','klassenerhalt':'Klassenerhalt','abstieg':'Absteiger','free':'Freitext'};
function fmtEuro(v){if(v===null||v===undefined)return '–';return (v>0?'+':'')+v.toFixed(2).replace('.',',')+' €'}
function el(t,a,c){const e=document.createElement(t);if(a)Object.keys(a).forEach(k=>{if(k==='class')e.className=a[k];else if(k.startsWith('on'))e.addEventListener(k.slice(2),a[k]);else e.setAttribute(k,a[k])});(c||[]).forEach(x=>{if(x!=null)e.appendChild(typeof x==='string'?document.createTextNode(x):x)});return e}
function computeResult(g){const b=g.bet||{},s=g.score||{};if(b.voided===true)return 'voided';if(b.type==='free')return b.manualResult;if(s.home===null||s.home===''||s.away===null||s.away==='')return null;const h=Number(s.home),a=Number(s.away);if(!b.type||!b.selection)return null;if(b.type==='1x2'){const o=h>a?'Heim':h<a?'Auswärts':'Unentschieden';return b.selection===o?'win':'loss'}if(b.type==='dc'){const o=h>a?'Heim':h<a?'Auswärts':'Unentschieden',m={'1X':['Heim','Unentschieden'],'12':['Heim','Auswärts'],'X2':['Unentschieden','Auswärts']};return(m[b.selection]||[]).includes(o)?'win':'loss'}if(b.type==='ou'){const t=h+a,l=Number(b.line);if(t===l)return null;return b.selection==='Über'?(t>l?'win':'loss'):(t<l?'win':'loss')}if(b.type==='btts')return((b.selection==='Ja')===(h>0&&a>0))?'win':'loss';if(b.type==='hc'){let ah=h,aa=a;if(b.hcTeam==='Heim')ah+=Number(b.hcValue);else aa+=Number(b.hcValue);if(ah===aa)return null;return b.selection===(ah>aa?'Heim':'Auswärts')?'win':'loss'}if(b.type==='htft'&&s.htHome!==null&&s.htHome!==''&&s.htAway!==null&&s.htAway!==''){const ht=Number(s.htHome)>Number(s.htAway)?'Heim':Number(s.htHome)<Number(s.htAway)?'Auswärts':'Unentschieden',ft=h>a?'Heim':h<a?'Auswärts':'Unentschieden';return(b.selection||'').includes(ht)&&(b.selection||'').includes(ft)?'win':'loss'}return null}
function gameProfit(g){const r=computeResult(g);if(r==='voided')return 0;if(r==='win'){const q=Number(g.bet.quote);return q?Math.round((q*STAKE-STAKE)*100)/100:null}if(r==='loss')return g.rank===1?0:-STAKE;return null}
function matchdayTotals(md){const t={};BASE_ORDER.forEach(p=>t[p]=0);md.games.forEach(g=>{const v=gameProfit(g);if(v!==null)t[g.player]+=v});return t}
function seasonBetProfit(b){if(!b||!b.manualResult)return b&&b.voided===true?0:null;if(b.voided===true)return 0;if(b.manualResult==='win'){const q=Number(b.quote);return q?Math.round((q*STAKE-STAKE)*100)/100:null}return b.manualResult==='loss'?-STAKE:null}
function seasonTotals(){const t={};BASE_ORDER.forEach(p=>t[p]=0);const per=[];state.matchdays.forEach(md=>{const x=matchdayTotals(md);per.push(x);BASE_ORDER.forEach(p=>t[p]+=x[p])});const sb={};BASE_ORDER.forEach(p=>{sb[p]=seasonBetProfit(state.seasonBets&&state.seasonBets[p]);if(sb[p]!==null)t[p]+=sb[p]});return{totals:t,perMd:per,sb}}
function betDescription(g){const b=g.bet||{};if(!b.type)return'Noch keine Wette eingetragen';const l=BET_TYPES[b.type]||b.type;if(b.type==='free')return(b.freitext||'—')+' · '+l;if(b.type==='ou')return l+' '+b.line+' · '+b.selection;if(b.type==='hc')return l+' '+b.hcTeam+' '+b.hcValue;return l+' · '+b.selection}
function renderHeader(){const w=el('div',{class:'scoreboard'});w.appendChild(el('div',{},[el('h1',{},['Tipprunde']),el('div',{class:'sub'},['Live-Übersicht · nur Lesen'])]));w.appendChild(el('div',{class:'tabs'},[['matchday','Spieltag'],['seasonbets','Saisonwetten'],['season','Saison']].map(x=>el('button',{class:'tab'+(currentTab===x[0]?' active':''),onclick:()=>{currentTab=x[0];render()}},[x[1]]))));return w}
function renderGame(g){const c=el('div',{class:'game'}),h=el('div',{class:'game-head'},[el('span',{class:'rank-badge'},['#'+g.rank]),el('div',{class:'teams'},[el('span',{},[g.home||'?']),el('span',{class:'vs'},['–']),el('span',{},[g.away||'?'])]),el('span',{class:'player-chip'},[g.player])]);c.appendChild(h);const b=el('div',{class:'game-body'}),left=el('div',{});left.appendChild(el('div',{class:'bet-desc'},[betDescription(g)]));if(g.bet.type&&g.bet.quote)left.appendChild(el('div',{class:'bet-desc'},['Quote: ',el('b',{},[String(g.bet.quote)])]));b.appendChild(left);b.appendChild(el('div',{class:'score-disp'},[(g.score.home??'–')+' : '+(g.score.away??'–')]));const r=computeResult(g);let cl='result-pending',lab='Offen';if(r==='win'){cl='result-win';lab='Gewonnen · '+fmtEuro(gameProfit(g))}else if(r==='loss'){cl='result-loss';lab='Verloren · '+fmtEuro(gameProfit(g))}else if(r==='voided'){cl='result-voided';lab='Storniert · 0,00 €'}b.appendChild(el('div',{class:'result-pill '+cl},[lab]));c.appendChild(b);return c}
function renderSummary(md){const t=matchdayTotals(md),b=el('div',{class:'summary'});b.appendChild(el('h3',{},['Spieltag '+md.nr]));const g=el('div',{class:'summary-grid'});BASE_ORDER.forEach(p=>{const v=t[p];g.appendChild(el('div',{class:'summary-item'},[el('div',{class:'name'},[p]),el('div',{class:'val '+(v>0?'pos':v<0?'neg':'zero')},[fmtEuro(v)])]))});b.appendChild(g);return b}
function renderMatchday(){const w=el('div',{}),md=state.matchdays[currentMdIndex],nav=el('div',{class:'md-nav'});nav.appendChild(el('select',{onchange:e=>{currentMdIndex=Number(e.target.value);render()}},state.matchdays.map((m,i)=>el('option',{value:i,...(i===currentMdIndex?{selected:'selected'}:{})},['Spieltag '+m.nr+(m.closed?' ✓':'')]))));w.appendChild(nav);md.games.forEach(g=>w.appendChild(renderGame(g)));w.appendChild(renderSummary(md));return w}
function renderSeasonBets(){const w=el('div',{});w.appendChild(el('div',{class:'status-line'},['Saisonwetten']));BASE_ORDER.forEach(p=>{const b=state.seasonBets&&state.seasonBets[p]||{},c=el('div',{class:'game'}),body=el('div',{class:'game-body'});c.appendChild(el('div',{class:'game-head'},[el('span',{class:'player-chip'},[p])]));body.appendChild(el('div',{class:'bet-desc'},[b.type?((b.team||b.freitext||'—')+' · '+(SEASON_BET_TYPES[b.type]||b.type)):'Noch keine Wette']));const r=b.voided===true?'voided':b.manualResult;body.appendChild(el('div',{class:'result-pill '+(r==='voided'?'result-voided':r==='win'?'result-win':r==='loss'?'result-loss':'result-pending'},[r==='voided'?'Storniert · 0,00 €':r==='win'?'Gewonnen · '+fmtEuro(seasonBetProfit(b)):r==='loss'?'Verloren · '+fmtEuro(seasonBetProfit(b)):'Offen']));c.appendChild(body);w.appendChild(c)});return w}
function renderSeason(){const {totals,perMd,sb}=seasonTotals(),w=el('div',{class:'table-wrap'}),table=el('table',{}),head=el('tr',{},[el('th',{},['Spieler'])]);state.matchdays.forEach(m=>head.appendChild(el('th',{},['ST '+m.nr])));head.appendChild(el('th',{},['Saisonwette']));head.appendChild(el('th',{},['Gesamt']));table.appendChild(el('thead',{},[head]));const body=el('tbody');BASE_ORDER.slice().sort((a,b)=>totals[b]-totals[a]).forEach(p=>{const row=el('tr',{},[el('td',{class:'player-name'},[p])]);perMd.forEach(t=>row.appendChild(el('td',{},[fmtEuro(t[p])])));row.appendChild(el('td',{},[sb[p]===null?'–':fmtEuro(sb[p])]));row.appendChild(el('td',{},[fmtEuro(totals[p])]));body.appendChild(row)});table.appendChild(body);w.appendChild(table);return w}
function render(){const a=document.getElementById('app');a.innerHTML='';a.appendChild(renderHeader());if(currentTab==='matchday')a.appendChild(renderMatchday());else if(currentTab==='seasonbets')a.appendChild(renderSeasonBets());else a.appendChild(renderSeason())}
fetch(DATA_URL+'?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{state=d;if(!state.matchdays)throw Error('Ungültiges Datenformat');currentMdIndex=state.matchdays.length-1;render()}).catch(e=>{document.getElementById('app').innerHTML='<div class="error-box">Konnte data.json nicht laden. ('+e.message+')</div>'});
</script></body></html>

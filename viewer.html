<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}#app{max-width:1100px;margin:0 auto;padding:20px 16px 80px}.scoreboard{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}.scoreboard h1{font-size:15px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 2px}.scoreboard .sub{font-size:13px;color:var(--muted)}.tabs{display:flex;gap:6px;background:var(--bg-elevated);border:1px solid var(--line);border-radius:999px;padding:4px}.tab{padding:7px 16px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);border:0;background:transparent;font-family:inherit}.tab.active{background:var(--accent);color:#1a1305}.md-nav{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}.md-nav select{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-family:monospace;font-size:14px}.md-badge{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:8px;background:var(--bg-elevated);border:1px solid var(--line);font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700}.game,.summary,.table-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}.game{margin-bottom:12px}.game-head{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}.rank-badge{font-family:monospace;font-size:11px;color:var(--muted);background:var(--bg-elevated);border:1px solid var(--line);border-radius:6px;padding:3px 7px}.teams{display:flex;align-items:center;gap:8px;flex:1;min-width:200px;font-size:15px;font-weight:600}.vs{color:var(--muted);font-size:12px}.player-chip{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:13px; amily:monospace;font-weight:700;background:var(--card)}.empty-state{color:var(--muted);font-size:14px;padding:30px 10px;text-align:center;border:1px dashed var(--line);border-radius:var(--radius)}.error-box{background:var(--loss-soft);border:1px solid var(--loss);color:var(--text);border-radius:var(--radius);padding:16px;font-size:14px}.status-line{font-size:12px;color:var(--muted);margin-bottom:14px}.chart-container{background:var(--bg-elevated);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:20px;min-height:450px}.chart-title{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text);margin-bottom:16px}.chart-wrapper{position:relative;height:350px;margin-bottom:16px}

<body><div id="app">Lädt…</div>
<script>
const DATA_URL='./data.json',STAKE=2,BASE_ORDER=['Tino','Spani','Muc','Julian','Malte','Markus','Michi','Thomas'];
const BET_TYPES={'1x2':'1X2',dc:'Doppelte Chance',ou:'Über/Unter',btts:'Beide treffen',hc:'Handicap',htft:'HZ/Endstand',free:'Freitext',wuo:'Wette'};
const SEASON_BET_TYPES={meister:'Deutscher Meister',top4:'Top 4',top6:'Top 6',top10:'Top 10',klassenerhalt:'Klassenerhalt',abstieg:'Absteiger',free:'Freitext'};
const PLAYER_COLORS={Tino:'#FF6B6B',Spani:'#4ECDC4',Muc:'#FFE66D',Julian:'#95E1D3',Malte:'#F38181',Markus:'#AA96DA',Michi:'#FCBAD3',Thomas:'#A8D8EA'};

function fmtEuro(v){if(v===null||v===undefined)return'–';return(v>0?'+':'')+v.toFixed(2).replace('.',',')+' €'}

function computeResult(game){const b=game.bet||{},s=game.score||{};if(b.voided===true)return'voided';if(b.type==='free')return b.manualResult;if(s.home==null||s.home===''||s.away==null||s.away==='')return null;const h=Number(s.home),a=Number(s.away);if(!b.type||!b.selection)return null;if(b.type==='1x2'){const o=h>a?'Heim':h<a?'Auswärts':'Unentschieden';return b.selection===o?'win':'loss'}if(b.type==='dc'){const o=h>a?'Heim':h<a?'Auswärts':'Unentschieden',m={'1X':['Heim','Unentschieden'],'12':['Heim','Auswärts'],'X2':['Unentschieden','Auswärts']};return(m[b.selection]||[]).includes(o)?'win':'loss'}if(b.type==='ou'){const t=h+a,l=Number(b.line);if(t===l)return null;if(b.selection==='Über')return t>l?'win':'loss';if(b.selection==='Unter')return t<l?'win':'loss'}if(b.type==='btts')return(b.selection==='Ja')===(h>0&&a>0)?'win':'loss';if(b.type==='hc'){let ah=h,aa=a;if(b.hcTeam==='Heim')ah+=Number(b.hcValue);else aa+=Number(b.hcValue);if(ah===aa)return null;return b.selection===(ah>aa?'Heim':'Auswärts')?'win':'loss'}if(b.type==='htft'){if(s.htHome==null||s.htAway==null)return null;const ht=Number(s.htHome)>Number(s.htAway)?'Heim':Number(s.htHome)<Number(s.htAway)?'Auswärts':'Unentschieden',ft=h>a?'Heim':h<a?'Auswärts':'Unentschieden';return(b.selection||'').includes(ht)&&(b.selection||'').includes(ft)?'win':'loss'}return null}
function gameProfit(g){const r=computeResult(g);if(r==='voided')return 0;if(r==='win'){const q=Number((g.bet||{}).quote);return q?Math.round((q*STAKE-STAKE)*100)/100:null}if(r==='loss')return g.rank===1?0:-STAKE;return null}
function matchdayTotals(md){const t={};BASE_ORDER.forEach(p=>t[p]=0);(md.games||[]).forEach(g=>{const v=gameProfit(g);if(v!==null&&t[g.player]!=null)t[g.player]+=v});return t}
function seasonBetProfit(b){if(!b||b.voided===true)return b&&b.voided===true?0:null;if(!b.manualResult)return null;if(b.manualResult==='loss')return-STAKE;if(b.manualResult==='win'){const q=Number(b.quote);return q?Math.round((q*STAKE-STAKE)*100)/100:null}return null}
function seasonTotals(){const totals={};BASE_ORDER.forEach(p=>totals[p]=0);const perMd=[];(state.matchdays||[]).forEach(md=>{const t=matchdayTotals(md);perMd.push(t);BASE_ORDER.forEach(p=>totals[p]+=t[p])});const sb={};BASE_ORDER.forEach(p=>{sb[p]=seasonBetProfit(state.seasonBets&&state.seasonBets[p]);if(sb[p]!==null)totals[p]+=sb[p]});return{totals,perMd,sb}}
function betDescription(g){const b=g.bet||{};if(!b.type)return'Noch keine Wette eingetragen';const l=BET_TYPES[b.type]||b.type;if(b.type==='free')return(b.freitext||'—')+' · '+l;if(b.type==='ou')return l+' '+b.line+' · '+b.selection;if(b.type==='hc')return l+' '+b.hcTeam+' '+b.hcValue;return l+' · '+b.selection}
function renderHeader(){return el('div',{class:'scoreboard'},[el('div',{},[el('h1',{},['Tipprunde']),el('div',{class:'sub'},['Live-Übersicht · nur Lesen'])]),el('div',{class:'tabs'},[el('button',{class:'tab'+(currentTab==='matchday'?' active':''),onclick:()=>{currentTab='matchday';render()}},['Spieltag']),el('button',{class:'tab'+(currentTab==='seasonbets'?' active':''),onclick:()=>{currentTab='seasonbets';render()}},['Saisonwetten']),el('button',{class:'tab'+(currentTab==='season'?' active':''),onclick:()=>{currentTab='season';render()}},['Saison'])])])}
function renderGame(g){const r=computeResult(g),p=gameProfit(g);let cls='result-pending',label='Offen';if(r==='win'){cls='result-win';label='Gewonnen · '+fmtEuro(p)}else if(r==='loss'){cls='result-loss';label='Verloren · '+fmtEuro(p)}else if(r==='voided'){cls='result-voided';label='Storniert · 0,00 €'}const body=el('div',{class:'game-body'},[el('div',{},[el('div',{class:'bet-desc'},[betDescription(g)]),g.bet&&g.bet.type&&g.bet.type!=='free'&&g.bet.quote?el('div',{class:'bet-desc'},['Quote: ',el('b',{},[String(g.bet.quote)])]):null]),el('div',{class:'score-disp'},[((g.score||{}).home??'–')+' : '+((g.score||{}).away??'–')]),el('div',{class:'result-pill '+cls},[label])]);return el('div',{class:'game'},[el('div',{class:'game-head'},[el('span',{class:'rank-badge'},['#'+g.rank]),g.rank===1?el('span',{class:'rank-badge',style:'color:var(--accent);border-color:var(--accent-soft)'},['Bonus · kostenlos']):null,el('div',{class:'teams'},[el('span',{},[g.home||'?']),el('span',{class:'vs'},['–']),el('span',{},[g.away||'?'])]),el('span',{class:'player-chip'},[g.player])]),body])}
function renderMatchdayView(){const md=state.matchdays[currentMdIndex],nav=el('div',{class:'md-nav'},[el('div',{class:'md-badge'},[String(md.nr)])]),sel=el('select',{onchange:e=>{currentMdIndex=Number(e.target.value);render()}});state.matchdays.forEach((m,i)=>sel.appendChild(el('option',{value:i,...(i===currentMdIndex?{selected:'selected'}:{})},['Spieltag '+m.nr+(m.closed?' ✓':'')])));nav.appendChild(sel);const wrap=el('div',{});wrap.appendChild(nav);md.games.forEach(g=>wrap.appendChild(renderGame(g)));const t=matchdayTotals(md);wrap.appendChild(el('div',{class:'summary'},[el('h3',{},['Spieltag '+md.nr]),el('div',{class:'summary-grid'},BASE_ORDER.map(p=>el('div',{class:'summary-item'},[el('div',{class:'name'},[p]),el('div',{class:'val '+(t[p]>0?'pos':t[p]<0?'neg':'zero')},[fmtEuro(t[p])])])))]));return wrap}
function renderSeasonBetsView(){const wrap=el('div',{});wrap.appendChild(el('div',{class:'status-line'},['Saisonwette Bundesliga '+(state.seasonYear||2026)+'/'+String((state.seasonYear||2026)+1).slice(2)+' – ein Tipp pro Mitspieler.']));BASE_ORDER.forEach(p=>{const b=state.seasonBets&&state.seasonBets[p]||{},r=b.voided?'voided':b.manualResult,profit=seasonBetProfit(b);let cls='result-pending',label='Offen';if(r==='voided'){cls='result-voided';label='Storniert · 0,00 €'}else if(r==='win'){cls='result-win';label='Gewonnen · '+fmtEuro(profit)}else if(r==='loss'){cls='result-loss';label='Verloren · '+fmtEuro(profit)}wrap.appendChild(el('div',{class:'game'},[el('div',{class:'game-head'},[el('span',{class:'player-chip'},[p])]),el('div',{class:'game-body'},[el('div',{class:'bet-desc'},[b.type?((b.type==='free'?b.freitext||'—':b.team||'—')+' · '+(SEASON_BET_TYPES[b.type]||b.type)+(b.quote?' · Quote '+b.quote:'')):'Noch keine Wette']),el('div',{class:'result-pill '+cls},[label])])]))});return wrap}
function renderSeasonChart(perMd){const datasets=BASE_ORDER.map(p=>{let total=0;return{label:p,data:perMd.map(t=>(total+=t[p]||0,total)),borderColor:PLAYER_COLORS[p],backgroundColor:PLAYER_COLORS[p],borderWidth:2.5,tension:.35,pointRadius:4,pointHoverRadius:7,pointBackgroundColor:PLAYER_COLORS[p],pointBorderColor:'#0F1417',pointBorderWidth:2,fill:false}});return{labels:state.matchdays.map(md=>'Spieltag '+md.nr),datasets}}
function renderSeasonView(){if(!state.matchdays.length)return el('div',{class:'empty-state'},['Noch keine Spieltage.']);const {totals,perMd,sb}=seasonTotals(),wrap=el('div',{}),chartBox=el('div',{class:'chart-container'},[el('div',{class:'chart-title'},['Gesamtgewinn über den Saisonverlauf'])]),chartWrap=el('div',{class:'chart-wrapper'}),canvas=el('canvas',{});chartWrap.appendChild(canvas);chartBox.appendChild(chartWrap);wrap.appendChild(chartBox);setTimeout(()=>{if(chartInstance)chartInstance.destroy();const d=renderSeasonChart(perMd);chartInstance=new Chart(canvas,{type:'line',data:d,options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:'#EEF1F0',font:{family:"'Inter',sans-serif",size:12,weight:'600'},padding:14,boxWidth:12,boxHeight:12,usePointStyle:true}},tooltip:{backgroundColor:'#1A2126',titleColor:'#EEF1F0',bodyColor:'#EEF1F0',borderColor:'#2A343B',borderWidth:1,callbacks:{label:c=>c.dataset.label+': '+fmtEuro(c.parsed.y)}}}},scales:{x:{title:{display:true,text:'Spieltag',color:'#EEF1F0',font:{size:12,weight:'bold'}},ticks:{color:'#EEF1F0',font:{size:12}},grid:{color:'#2A343B'},border:{display:false}},y:{title:{display:true,text:'Gesamtgewinn (€)',color:'#EEF1F0',font:{size:12,weight:'bold'}},ticks:{color:'#EEF1F0',font:{size:12},callback:v=>(v>0?'+':'')+Number(v).toFixed(2).replace('.',',')+' €'},grid:{color:'#2A343B'},border:{display:false}}}}})},0);const ranked=BASE_ORDER.slice().sort((a,b)=>totals[b]-totals[a]),table=el('table',{class:'season'}),head=el('tr',{},[el('th',{class:'player-col'},['Spieler'])]);state.matchdays.forEach(md=>head.appendChild(el('th',{},['ST '+md.nr])));head.appendChild(el('th',{},['Saisonwette']));head.appendChild(el('th',{},['Gesamt']));const tbody=el('tbody',{});ranked.forEach(p=>{const row=el('tr',{},[el('td',{class:'player-name'},[p])]);perMd.forEach(t=>row.appendChild(el('td',{class:t[p]>0?'pos':t[p]<0?'neg':'zero'},[fmtEuro(t[p])] )));const sv=sb[p];row.appendChild(el('td',{class function render(){const app=document.getElementById('app');app.innerHTML='';app.appendChild(renderHeader());app.appendChild(currentTab==='matchday'?renderMatchdayView():currentTab==='seasonbets'?renderSeasonBetsView():renderSeasonView())}
async function loadData(){try{const r=await fetch(DATA_URL+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);state=await r.json();if(!Array.isArray(state.matchdays))throw Error('Ungültiges Datenformat');currentMdIndex=Math.max(0,state.matchdays.length-1);render()}catch(e){document.getElementById('app').innerHTML='';document.getElementById('app').appendChild(el('div',{class:'error-box'},['Konnte data.json nicht laden. ('+e.message+')']))}}

</script></body></html>

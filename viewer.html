<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Tipprunde</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0F1417">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
  <style>
    :root{--bg:#0F1417;--bg-elevated:#151B1F;--card:#1A2126;--line:#2A343B;--text:#EEF1F0;--muted:#8B9AA3;--accent:#FFB238;--accent-soft:#4A3A1C;--win:#3FA35A;--win-soft:#16281C;--loss:#E4572E;--loss-soft:#2C1913;--void:#B08D57;--void-soft:#2B241A;--pending:#586570;--radius:10px}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
    #app{max-width:1100px;margin:0 auto;padding:20px 16px 80px}
    .tabs{display:flex;gap:6px;background:var(--bg-elevated);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:20px}
    .tab{padding:7px 16px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);border:none;background:transparent;font-family:inherit}
    .tab.active{background:var(--accent);color:#1a1305}
    .tab-content{display:none}
    .tab-content.active{display:block}
    .chart-container{position:relative;height:400px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:20px}
    .season-chart{position:relative;width:100%;height:100%}
  </style>
</head>
<body>
  <div id="app">Lädt…</div>
  <script>
    const DATA_URL = './data.json';
    const STAKE = 2;
    const BASE_ORDER = ['Tino', 'Spani', 'Muc', 'Julian', 'Malte', 'Markus', 'Michi', 'Thomas'];
    const BET_TYPES = {'1x2': '1X2', 'dc': 'Doppelte Chance', 'ou': 'Über/Unter', 'btts': 'Beide treffen', 'hc': 'Handicap', 'htft': 'HZ/Endstand', 'free': 'Freitext', 'wuo': 'Wette'};
    const SEASON_BET_TYPES = {'meister': 'Deutscher Meister', 'top4': 'Top 4', 'top6': 'Top 6', 'top10': 'Top 10', 'klassenerhalt': 'Klassenerhalt', 'abstieg': 'Absteiger', 'free': 'Freitext'};
    const PLAYER_COLORS = {Tino: '#FF6B6B', Spani: '#4ECDC4', Muc: '#FFE66D', Julian: '#95E1D3', Malte: '#F38181', Markus: '#AA96DA', Michi: '#FCBAD3', Thomas: '#A8D8EA'};

    let state = null, currentTab = 'matchday', chartInstance = null;

    function fmtEuro(v) {
      if (v === null || v === undefined) return '–';
      const sign = v > 0 ? '+' : '';
      return sign + v.toFixed(2).replace('.', ',') + ' €';
    }

    function el(tag, attrs, children) {
      const e = document.createElement(tag);
      if (attrs) {
        Object.keys(attrs).forEach(k => {
          if (attrs[k] == null) return;
          if (k === 'class') e.className = attrs[k];
          else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
          else e.setAttribute(k, attrs[k]);
        });
      }
      (children || []).forEach(c => {
        if (c != null) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
      });
      return e;
    }

    function computeResult(game) {
      const b = game.bet || {};
      const s = game.score || {};
      if (b.voided === true) return 'voided';
      if (b.type === 'free') return b.manualResult;
      if (s.home === null || s.home === '' || s.away === null || s.away === '') return null;
      const h = Number(s.home), a = Number(s.away);
      if (!b.type || !b.selection) return null;
      if (b.type === '1x2') {
        const out = h > a ? 'Heim' : (h < a ? 'Auswärts' : 'Unentschieden');
        return b.selection === out ? 'win' : 'loss';
      }
      return null;
    }

    function gameProfit(game) {
      const res = computeResult(game);
      if (res === 'win') {
        const q = Number(game.bet.quote);
        if (!q) return null;
        return Math.round((q * STAKE - STAKE) * 100) / 100;
      }
      if (res === 'loss') return game.rank === 1 ? 0 : -STAKE;
      return null;
    }

    function matchdayTotals(md) {
      const totals = {};
      BASE_ORDER.forEach(p => totals[p] = 0);
      md.games.forEach(g => {
        const p = gameProfit(g);
        if (p !== null) totals[g.player] += p;
      });
      return totals;
    }

    function seasonTotals() {
      const totals = {};
      BASE_ORDER.forEach(p => totals[p] = 0);
      const perMd = [];
      state.matchdays.forEach(md => {
        const t = matchdayTotals(md);
        perMd.push(t);
        Object.keys(t).forEach(p => totals[p] += t[p]);
      });
      return {totals, perMd};
    }

    function buildSeasonChart() {
      const {totals, perMd} = seasonTotals();
      const datasets = [];

      BASE_ORDER.forEach(player => {
        let cumulative = 0;
        const data = perMd.map(md => {
          cumulative += md[player] || 0;
          return cumulative;
        });

        datasets.push({
          label: player,
          data: data,
          borderColor: PLAYER_COLORS[player] || '#888',
          backgroundColor: PLAYER_COLORS[player] + '20',
          tension: 0.3,
          fill: false,
          borderWidth: 2
        });
      });

      const labels = state.matchdays.map((md, idx) => 'MD ' + (idx + 1));

      if (chartInstance) chartInstance.destroy();

      const chartCanvas = document.getElementById('seasonChart');
      if (!chartCanvas) return;

      chartInstance = new Chart(chartCanvas, {
        type: 'line',
        data: {labels, datasets},
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              labels: {color: '#EEF1F0', font: {size: 12}},
              display: true
            }
          },
          scales: {
            x: {
              ticks: {color: '#8B9AA3'},
              grid: {color: '#2A343B'}
            },
            y: {
              ticks: {color: '#8B9AA3'},
              grid: {color: '#2A343B'},
              title: {display: true, text: 'Gesamtgewinn (€)', color: '#EEF1F0'}
            }
          }
        }
      });
    }

    async function loadData() {
      const app = document.getElementById('app');
      try {
        const res = await fetch(DATA_URL + '?t=' + Date.now(), {cache: 'no-store'});
        if (!res.ok) throw new Error('HTTP ' + res.status);
        state = await res.json();
        if (!state.matchdays) throw new Error('Ungültiges Datenformat');
        render();
      } catch (e) {
        app.innerHTML = '';
        app.appendChild(el('div', {class: 'error-box'}, [
          'Konnte data.json nicht laden. (' + e.message + ')'
        ]));
      }
    }

    function render() {
      const app = document.getElementById('app');
      const {totals} = seasonTotals();

      app.innerHTML = '';

      // Tabs
      const tabsContainer = el('div', {class: 'tabs'}, [
        el('button', {class: 'tab active', 'data-tab': 'overview', onclick: () => switchTab('overview')}, ['Übersicht']),
        el('button', {class: 'tab', 'data-tab': 'chart', onclick: () => switchTab('chart')}, ['Grafik'])
      ]);
      app.appendChild(tabsContainer);

      // Overview Tab
      const overviewTab = el('div', {class: 'tab-content active', id: 'overview-content'});
      const statsContainer = el('div', {class: 'stats'});
      BASE_ORDER.forEach(player => {
        const val = totals[player] || 0;
        statsContainer.appendChild(el('div', {class: 'stat-item'}, [
          el('div', {class: 'stat-name'}, [player]),
          el('div', {class: 'stat-value', style: 'color:' + (val > 0 ? '#3FA35A' : val < 0 ? '#E4572E' : '#8B9AA3')}, [fmtEuro(val)])
        ]));
      });
      overviewTab.appendChild(statsContainer);
      app.appendChild(overviewTab);

      // Chart Tab
      const chartTab = el('div', {class: 'tab-content', id: 'chart-content'});
      const chartContainer = el('div', {class: 'chart-container'});
      chartContainer.appendChild(el('canvas', {id: 'seasonChart', class: 'season-chart'}));
      chartTab.appendChild(chartContainer);
      app.appendChild(chartTab);

      // Show chart when tab is clicked
      setTimeout(() => buildSeasonChart(), 100);
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      
      document.querySelector('[data-tab="' + tabName + '"]').classList.add('active');
      document.getElementById(tabName + '-content').classList.add('active');

      if (tabName === 'chart') {
        setTimeout(() => buildSeasonChart(), 100);
      }
    }

    loadData();
  </script>
</body>
</html>

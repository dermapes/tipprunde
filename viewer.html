<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Tipprunde</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0F1417">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
  <style>
    :root{--bg:#0F1417;--bg-elevated:#151B1F;--card:#1A2126;--line:#2A343B;--text:#EEF1F0;--muted:#8B9AA3;--accent:#FFB238;--accent-soft:#4A3A1C;--win:#3FA35A;--win-soft:#16281C;--loss:#E4572E;--loss-soft:#2C1913;--void:#B08D57;--void-soft:#2B241A;--pending:#586570;--radius:10px}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}#app{max-width:1100px;margin:0 auto;padding:20px 16px 80px}.scoreboard{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}.scoreboard h1{font-size:15px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 2px}.scoreboard .sub{font-size:13px;color:var(--muted)}.tabs{display:flex;gap:6px;background:var(--bg-elevated);border:1px solid var(--line);border-radius:999px;padding:4px}.tab{padding:7px 16px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);border:none;background:transparent;font-family:inherit}.tab.active{background:var(--accent);color:#1a1305}.md-nav{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}.md-nav select{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-family:monospace;font-size:14px}.md-badge{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:8px;background:var(--bg-elevated);border:1px solid var(--line);font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700}.game,.summary,.table-wrap,.chart-container{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}.game{margin-bottom:12px}.game-head{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}.rank-badge{font-family:monospace;font-size:11px;color:var(--muted);background:var(--bg-elevated);border:1px solid var(--line);border-radius:6px;padding:3px 7px}.teams{display:flex;align-items:center;gap:8px;flex:1;min-width:200px;font-size:15px;font-weight:600}.vs{color:var(--muted);font-size:12px}.player-chip{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:13px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:5px 12px;letter-spacing:.03em}.game-body{padding:14px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.bet-desc{font-size:13px;color:var(--muted)}.bet-desc b{color:var(--text)}.score-disp{font-family:monospace;font-size:20px;font-weight:700}.result-pill{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;border-radius:8px;padding:8px 14px;text-align:center;min-width:110px}.result-pending{background:var(--bg-elevated);color:var(--pending);border:1px dashed var(--line)}.result-win{background:var(--win-soft);color:var(--win)}.result-loss{background:var(--loss-soft);color:var(--loss)}.result-voided{background:var(--void-soft);color:var(--void)}.summary{background:var(--bg-elevated);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-top:18px}.summary h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.summary-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}.summary-item{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 10px}.summary-item .name{font-size:12px;color:var(--muted)}.summary-item .val{font-family:monospace;font-weight:700;font-size:16px;margin-top:2px}.val.pos{color:var(--win)}.val.neg{color:var(--loss)}.val.zero{color:var(--muted)}.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius)}table.season{border-collapse:collapse;width:100%;font-size:13px}table.season th,table.season td{padding:9px 12px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}table.season th{background:var(--bg-elevated);color:var(--muted);font-weight:600;text-transform:uppercase;font-size:11px}table.season td.player-name{text-align:left;font-weight:700;font-family:'Barlow Condensed',sans-serif;font-size:15px;background:var(--card);position:sticky;left:0}table.season th.player-col{text-align:left;position:sticky;left:0;background:var(--bg-elevated)}table.season td.total{font-family:monospace;font-weight:700;background:var(--card)}.empty-state{color:var(--muted);font-size:14px;padding:30px 10px;text-align:center;border:1px dashed var(--line);border-radius:var(--radius)}.error-box{background:var(--loss-soft);border:1px solid var(--loss);color:var(--text);border-radius:var(--radius);padding:16px;font-size:14px}.status-line{font-size:12px;color:var(--muted);margin-bottom:14px}.chart-container{background:var(--bg-elevated);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:0 0 20px}.chart-title{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text);margin-bottom:16px}.chart-wrapper{position:relative;height:350px;margin-bottom:16px}.live-tag{font-size:10px;color:var(--win);border:1px solid var(--win);border-radius:5px;padding:1px 5px;margin-left:6px}
  </style>
</head>
<body>
  <div id="app">Lädt…</div>
  <script>
    const DATA_URL='./data.json';
    const STAKE=2;
    const BASE_ORDER=['Tino','Spani','Muc','Julian','Malte','Markus','Michi','Thomas'];
    const BET_TYPES={'1x2':'1X2',dc:'Doppelte Chance',ou:'Über/Unter',btts:'Beide treffen',hc:'Handicap',htft:'HZ/Endstand',free:'Freitext',wuo:'Wette'};
    const SEASON_BET_TYPES={meister:'Deutscher Meister',top4:'Top 4',top6:'Top 6',top10:'Top 10',klassenerhalt:'Klassenerhalt',abstieg:'Absteiger',free:'Freitext'};
    const PLAYER_COLORS={Tino:'#FF6B6B',Spani:'#4ECDC4',Muc:'#FFE66D',Julian:'#95E1D3',Malte:'#F38181',Markus:'#AA96DA',Michi:'#FCBAD3',Thomas:'#A8D8EA'};

    let state=null,currentTab='matchday',currentMdIndex=0,liveScores={},chartInstance=null;

    function fmtEuro(v){if(v===null||v===undefined)return'–';const sign=v>0?'+':'';return sign+v.toFixed(2).replace('.',',')+' €'}
    function el(tag,attrs,children){const e=document.createElement(tag);if(attrs){Object.keys(attrs).forEach(k=>{if(attrs[k]==null||attrs[k]===undefined)return;if(k==='class')e.className=attrs[k];else if(k.startsWith('on'))e.addEventListener(k.slice(2),attrs[k]);else e.setAttribute(k,attrs[k])})} (children||[]).forEach(c=>{if(c==null)return;e.appendChild(typeof c==='string'?document.createTextNode(c):c)});return e}
    function normalizeTeam(s){if(!s)return'';const stripWords=['1','fc','sv','sc','tsg','vfb','vfl','fsv','borussia','sg','spvgg','04','05','07','1899','ev'];let n=String(s).toLowerCase().replace(/[.,]/g,' ');return n.split(/\s+/).filter(w=>w&&!stripWords.includes(w)).join(' ').trim()}
    function teamsMatch(a,b){const na=normalizeTeam(a),nb=normalizeTeam(b);if(!na||!nb)return false;return na===nb||na.includes(nb)||nb.includes(na)}
    function currentMatchday(){if(!state||!Array.isArray(state.matchdays)||!state.matchdays.length)return null;return state.matchdays[currentMdIndex]||state.matchdays[state.matchdays.length-1]}

    function computeResult(game){
      const b=game.bet||{},s=game.score||{};
      if(b.voided===true)return 'voided';
      if(b.type==='free')return b.manualResult;
      if(s.home===null||s.home===''||s.away===null||s.away==='')return null;
      const h=Number(s.home),a=Number(s.away); if(!b.type||!b.selection)return null;
      if(b.type==='1x2'){const out=h>a?'Heim':(h<a?'Auswärts':'Unentschieden'); return b.selection===out?'win':'loss'}
      if(b.type==='dc'){const out=h>a?'Heim':(h<a?'Auswärts':'Unentschieden'); const map={'1X':['Heim','Unentschieden'],'12':['Heim','Auswärts'],'X2':['Unentschieden','Auswärts']}; return (map[b.selection]||[]).includes(out)?'win':'loss'}
      if(b.type==='ou'){const total=h+a,line=Number(b.line);if(total===line)return null;if(b.selection==='Über')return total>line?'win':'loss';if(b.selection==='Unter')return total<line?'win':'loss'}
      if(b.type==='btts'){const both=h>0&&a>0; return (b.selection==='Ja')===both?'win':'loss'}
      if(b.type==='hc'){const val=Number(b.hcValue);let adjH=h,adjA=a;if(b.hcTeam==='Heim')adjH+=val;else adjA+=val;if(adjH===adjA)return null; const winner=adjH>adjA?'Heim':'Auswärts'; return b.selection===winner?'win':'loss'}
      if(b.type==='htft'){if(s.htHome===null||s.htHome===''||s.htAway===null||s.htAway==='')return null;const hh=Number(s.htHome),ha=Number(s.htAway),htOut=hh>ha?'Heim':(hh<ha?'Auswärts':'Unentschieden'),ftOut=h>a?'Heim':(h<a?'Auswärts':'Unentschieden'); return (b.selection||'').includes(htOut)&&(b.selection||'').includes(ftOut)?'win':'loss'}
      return null;
    }

    function getEffectiveGame(game){
      const md=currentMatchday();
      if(!md||md.closed)return game;
      const live=liveScores[game.rank];
      if(!live)return game;
      return {...game,score:{...(game.score||{}),home:live.home,away:live.away}};
    }

    function gameProfit(game){
      const effective=getEffectiveGame(game);
      const result=computeResult(effective);
      if(result==='voided')return 0;
      if(result==='win'){const q=Number((effective.bet||{}).quote);if(!q)return null;return Math.round((q*STAKE-STAKE)*100)/100}
      if(result==='loss')return game.rank===1?0:-STAKE;
      return null;
    }

    function matchdayTotals(md){const totals={};BASE_ORDER.forEach(p=>totals[p]=0);(md.games||[]).forEach(g=>{const profit=gameProfit(g); if(profit!==null) totals[g.player] += profit}); return totals}
    function seasonBetProfit(b){if(!b)return null;if(b.voided===true)return 0;if(!b.manualResult)return null;if(b.manualResult==='win'){const q=Number(b.quote);if(!q)return null; return Math.round((q*STAKE-STAKE)*100)/100} if(b.manualResult==='loss') return -STAKE; return null}
    function seasonTotals(){const totals={};BASE_ORDER.forEach(p=>totals[p]=0);const perMd=[];(state.matchdays||[]).forEach(md=>{const t=matchdayTotals(md);perMd.push(t);BASE_ORDER.forEach(p=>totals[p]+=t[p])});const sb={};BASE_ORDER.forEach(p=>{const v=seasonBetProfit(state.seasonBets&&state.seasonBets[p]); sb[p]=v; if(v!==null) totals[p]+=v}); return {totals,perMd,sb}}

    function betDescription(g){const b=g.bet||{};if(!b.type)return'Noch keine Wette eingetragen'; const label=BET_TYPES[b.type]||b.type; if(b.type==='free') return (b.freitext||'—') + ' · ' + label; if(b.type==='ou') return label + ' ' + b.line + ' · ' + b.selection; if(b.type==='hc') return label + ' ' + b.hcTeam + ' ' + b.hcValue; return label + ' · ' + b.selection}

    function renderHeader(){const wrap=el('div',{class:'scoreboard'},[el('div',{},[el('h1',{},['Tipprunde']),el('div',{class:'sub'},['Live-Übersicht · nur Lesen'])]),el('div',{class:'tabs'},[el('button',{class:'tab'+(currentTab==='matchday'?' active':''),onclick:()=>{currentTab='matchday';render()}},['Spieltag']),el('button',{class:'tab'+(currentTab==='seasonbets'?' active':''),onclick:()=>{currentTab='seasonbets';render()}},['Saisonwetten']),el('button',{class:'tab'+(currentTab==='season'?' active':''),onclick:()=>{currentTab='season';render()}},['Saison'])])]); return wrap}

    function displayScore(game){
      const md=currentMatchday();
      if(md && !md.closed){
        const live=liveScores[game.rank];
        if(live) return {home:live.home,away:live.away,isLive:!live.finished};
      }
      const score=game.score||{}; return {home:score.home,away:score.away,isLive:false};
    }

    function renderGame(game){
      const score=displayScore(game);
      const result=computeResult(getEffectiveGame(game));
      const profit=gameProfit(game);
      let cls='result-pending',label='Offen';
      if(result==='win'){cls='result-win';label='Gewonnen · '+fmtEuro(profit)}
      else if(result==='loss'){cls='result-loss';label='Verloren · '+fmtEuro(profit)}
      else if(result==='voided'){cls='result-voided';label='Storniert · 0,00 €'}

      const card=el('div',{class:'game'},[el('div',{class:'game-head'},[
        el('span',{class:'rank-badge'},['#'+game.rank]),
        game.rank===1?el('span',{class:'rank-badge',style:'color:var(--accent);border-color:var(--accent-soft);'},['Bonus · kostenlos']):null,
        el('div',{class:'teams'},[el('span',{},[game.home||'?']),el('span',{class:'vs'},['–']),el('span',{},[game.away||'?'])]),
        el('span',{class:'player-chip'},[game.player])
      ]),el('div',{class:'game-body'},[
        el('div',{},[el('div',{class:'bet-desc'},[betDescription(game)]), (game.bet&&game.bet.type&&game.bet.type!=='free'&&game.bet.quote)?el('div',{class:'bet-desc'},['Quote: ',el('b',{},[String(game.bet.quote)])]):null]),
        el('div',{class:'score-disp'},[(score.home ?? '–') + ' : ' + (score.away ?? '–') + (score.isLive ? ' ' : '') + (score.isLive ? el('span',{class:'live-tag'},['LIVE']) : '')]),
        el('div',{class:'result-pill '+cls},[label])
      ])]);
      return card;
    }

    function renderMatchdaySummary(md){const totals=matchdayTotals(md); const box=el('div',{class:'summary'},[el('h3',{},['Spieltag '+md.nr]), el('div',{class:'summary-grid'}, BASE_ORDER.map(p=>{const v=totals[p];const cls=v>0?'pos':(v<0?'neg':'zero'); return el('div',{class:'summary-item'},[el('div',{class:'name'},[p]),el('div',{class:'val '+cls},[fmtEuro(v)])])}))]); return box}

    function renderMatchdayView(){
      const md=currentMatchday(); const wrap=el('div',{}),nav=el('div',{class:'md-nav'},[el('div',{class:'md-badge'},[String(md.nr)]), el('select',{onchange:e=>{currentMdIndex=Number(e.target.value);liveScores={};render();fetchLiveScores();}}, state.matchdays.map((m,i)=>el('option',{value:i, ...(i===currentMdIndex?{selected:'selected'}:{})},['Spieltag '+m.nr+(m.closed?' ✓':''))))]);
      wrap.appendChild(nav);
      (md.games||[]).forEach(g=>wrap.appendChild(renderGame(g)));
      wrap.appendChild(renderMatchdaySummary(md));
      return wrap;
    }

    function renderSeasonBetsView(){
      const wrap=el('div',{}); wrap.appendChild(el('div',{class:'status-line'},['Saisonwette Bundesliga '+(state.seasonYear||2026)+'/'+String((state.seasonYear||2026)+1).slice(2)+' – ein Tipp pro Mitspieler.']));
      BASE_ORDER.forEach(player=>{const bet=state.seasonBets&&state.seasonBets[player]?state.seasonBets[player]:{}; const card=el('div',{class:'game'},[el('div',{class:'game-head'},[el('span',{class:'player-chip'},[player])]),el('div',{class:'game-body'},[el('div',{class:'bet-desc'},[bet.type ? (bet.type==='free' ? (bet.freitext||'—') : (bet.team||'—'))+' · '+(SEASON_BET_TYPES[bet.type]||bet.type)+(bet.quote? ' · Quote '+bet.quote:'') : 'Noch keine Wette']),el('div',{class:'result-pill '+(bet.voided===true?'result-voided':bet.manualResult==='win'?'result-win':bet.manualResult==='loss'?'result-loss':'result-pending')},[bet.voided===true?'Storniert · 0,00 €':bet.manualResult==='win'?'Gewonnen · '+fmtEuro(seasonBetProfit(bet)):bet.manualResult==='loss'?'Verloren · '+fmtEuro(seasonBetProfit(bet)):'Offen'])])]); wrap.appendChild(card)}); return wrap;
    }

    function renderSeasonChart(perMd){
      const datasets=BASE_ORDER.map(player=>{let total=0; return {label:player,data:perMd.map(mdT=>(total += mdT[player]||0,total)),borderColor:PLAYER_COLORS[player],backgroundColor:PLAYER_COLORS[player]+'15',borderWidth:2.5,tension:0.35,pointRadius:4,pointHoverRadius:7,pointBackgroundColor:PLAYER_COLORS[player],pointBorderColor:'#0F1417',pointBorderWidth:2,fill:false}});
      return {labels:(state.matchdays||[]).map(md=>'Spieltag '+md.nr),datasets};
    }

    function renderSeasonView(){
      if(!state.matchdays.length) return el('div',{class:'empty-state'},['Noch keine Spieltage.']);
      const {totals,perMd,sb}=seasonTotals();
      const wrap=el('div',{});
      const chartBox=el('div',{class:'chart-container'},[el('div',{class:'chart-title'},['Gesamtgewinn über den Saisonverlauf'])]);
      const chartWrap=el('div',{class:'chart-wrapper'},[el('canvas',{})]);
      chartBox.appendChild(chartWrap); wrap.appendChild(chartBox);
      setTimeout(()=>{if(chartInstance)chartInstance.destroy(); const data=renderSeasonChart(perMd); chartInstance=new Chart(chartWrap.querySelector('canvas'),{type:'line',data,options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:'#EEF1F0',font:{family:"'Inter', sans-serif",size:12,weight:'600'},padding:14,boxWidth:12,boxHeight:12,usePointStyle:true}},tooltip:{backgroundColor:'#1A2126',titleColor:'#EEF1F0',bodyColor:'#EEF1F0',borderColor:'#2A343B',borderWidth:1,callbacks:{label:(ctx)=>ctx.dataset.label+': '+fmtEuro(ctx.parsed.y)}}},scales:{x:{title:{display:true,text:'Spieltag',color:'#EEF1F0',font:{size:12,weight:'bold'}},ticks:{color:'#EEF1F0',font:{size:12}},grid:{color:'#2A343B'},border:{display:false}},y:{title:{display:true,text:'Gesamtgewinn (€)',color:'#EEF1F0',font:{size:12,weight:'bold'}},ticks:{color:'#EEF1F0',font:{size:12},callback:(v)=>((v>0?'+':'') + Number(v).toFixed(2).replace('.',',') + ' €')},grid:{color:'#2A343B'},border:{display:false}}}}});},0);

      const ranked=BASE_ORDER.slice().sort((a,b)=>totals[b]-totals[a]);
      const tableWrap=el('div',{class:'table-wrap'},[el('table',{class:'season'},[el('thead',{},[el('tr',{},[el('th',{class:'player-col'},['Spieler'])].concat((state.matchdays||[]).map(md=>el('th',{},['ST '+md.nr]))).concat([el('th',{},['Saisonwette']),el('th',{},['Gesamt'])]))]), el('tbody',{}, ranked.map(player=>{const row=el('tr',{},[el('td',{class:'player-name'},[player])]); perMd.forEach(mdT=>{const v=mdT[player]; const cls=v>0?'pos':(v<0?'neg':'zero'); row.appendChild(el('td',{class:cls},[fmtEuro(v)]))}); const sbVal=sb[player]; const sbCls=sbVal==null?'':(sbVal>0?'pos':(sbVal<0?'neg':'zero')); row.appendChild(el('td',{class:sbCls},[sbVal==null?'–':fmtEuro(sbVal)])); const total=totals[player]; const totalCls=total>0?'pos':(total<0?'neg':'zero'); row.appendChild(el('td',{class:'total '+totalCls},[fmtEuro(total)])); return row}))])])]);
      wrap.appendChild(tableWrap); return wrap;
    }

    async function fetchLiveScores(){
      if(!state||!state.matchdays||!state.matchdays.length)return;
      const md=currentMatchday(); if(!md||md.closed)return;
      try{
        const url=`https://api.openligadb.de/getmatchdata/bl1/${state.seasonYear||2026}/${md.nr}`;
        const res=await fetch(url,{cache:'no-store'});
        if(!res.ok)return;
        const data=await res.json();
        liveScores={};
        (data||[]).forEach(match=>{
          const homeApi=match.team1&&match.team1.teamName, awayApi=match.team2&&match.team2.teamName;
          if(!homeApi||!awayApi)return;
          const g=(md.games||[]).find(game=>teamsMatch(game.home,homeApi)&&teamsMatch(game.away,awayApi));
          if(!g)return;
          if(match.matchResults && match.matchResults.length){
            const final=match.matchResults.find(r=>r.resultTypeID===2) || match.matchResults[match.matchResults.length-1];
            if(final){
              liveScores[g.rank]={home:final.pointsTeam1,away:final.pointsTeam2,finished:match.matchIsFinished};
            }
          }
        });
        render();
      }catch(e){console.warn('Live scores konnten nicht geladen werden:',e)}
    }

    function render(){
      const app=document.getElementById('app');
      app.innerHTML='';
      app.appendChild(renderHeader());
      if(currentTab==='matchday')app.appendChild(renderMatchdayView());
      else if(currentTab==='seasonbets')app.appendChild(renderSeasonBetsView());
      else app.appendChild(renderSeasonView());
    }

    async function loadData(){
      const app=document.getElementById('app');
      app.textContent='Lädt…';
      try{
        const res=await fetch(DATA_URL+'?t='+Date.now(),{cache:'no-store'});
        if(!res.ok)throw new Error('HTTP '+res.status);
        const data=await res.json();
        if(!data || !Array.isArray(data.matchdays)) throw new Error('Ungültiges Datenformat');
        state=data; currentMdIndex=Math.max(0,state.matchdays.length-1); render(); fetchLiveScores();
      }catch(e){console.error('Viewer konnte nicht geladen werden:',e); app.innerHTML=''; app.appendChild(el('div',{class:'error-box'},['Konnte data.json nicht laden. ('+e.message+')'])); }
    }

    if('serviceWorker' in navigator){ navigator.serviceWorker.register('/sw.js').catch(()=>{}) }
    loadData();
  </script>
</body>
</html>

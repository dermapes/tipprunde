<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Tipprunde</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0F1417" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0F1417;
      --bg-elevated: #151B1F;
      --card: #1A2126;
      --line: #2A343B;
      --text: #EEF1F0;
      --muted: #8B9AA3;
      --accent: #FFB238;
      --accent-soft: #4A3A1C;
      --win: #3FA35A;
      --win-soft: #16281C;
      --loss: #E4572E;
      --loss-soft: #2C1913;
      --void: #B08D57;
      --void-soft: #2B241A;
      --pending: #586570;
      --radius: 10px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      padding-bottom: env(safe-area-inset-bottom);
    }

    #app {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 16px 80px;
    }

    .scoreboard {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }

    .scoreboard h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 2px;
    }

    .scoreboard .sub {
      font-size: 13px;
      color: var(--muted);
    }

    .tabs {
      display: flex;
      gap: 6px;
      background: var(--bg-elevated);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px;
    }

    .tab {
      padding: 7px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: var(--muted);
      border: none;
      background: transparent;
      font-family: inherit;
    }

    .tab.active {
      background: var(--accent);
      color: #1a1305;
    }

    .md-nav {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .md-nav select {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 12px;
      font-family: 'Space Mono', monospace;
      font-size: 14px;
    }

    .md-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 8px;
      background: var(--bg-elevated);
      border: 1px solid var(--line);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 18px;
      font-weight: 700;
    }

    .game,
    .summary,
    .table-wrap {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .game {
      margin-bottom: 12px;
    }

    .game-head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap;
    }

    .rank-badge {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      background: var(--bg-elevated);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 3px 7px;
    }

    .teams {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 200px;
      font-size: 15px;
      font-weight: 600;
    }

    .vs {
      color: var(--muted);
      font-size: 12px;
    }

    .player-chip {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 600;
      font-size: 13px;
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 999px;
      padding: 5px 12px;
      letter-spacing: 0.03em;
    }

    .game-body {
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .bet-desc {
      font-size: 13px;
      color: var(--muted);
    }

    .bet-desc b {
      color: var(--text);
    }

    .score-disp {
      font-family: 'Space Mono', monospace;
      font-size: 20px;
      font-weight: 700;
    }

    .result-pill {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 15px;
      border-radius: 8px;
      padding: 8px 14px;
      text-align: center;
      min-width: 110px;
    }

    .result-pending {
      background: var(--bg-elevated);
      color: var(--pending);
      border: 1px dashed var(--line);
    }

    .result-win {
      background: var(--win-soft);
      color: var(--win);
    }

    .result-loss {
      background: var(--loss-soft);
      color: var(--loss);
    }

    .result-voided {
      background: var(--void-soft);
      color: var(--void);
    }

    .summary {
      background: var(--bg-elevated);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      margin-top: 18px;
    }

    .summary h3 {
      margin: 0 0 10px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 8px;
    }

    .summary-item {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 10px;
    }

    .summary-item .name {
      font-size: 12px;
      color: var(--muted);
    }

    .summary-item .val {
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      font-size: 16px;
      margin-top: 2px;
    }

    .val.pos { color: var(--win); }
    .val.neg { color: var(--loss); }
    .val.zero { color: var(--muted); }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    table.season {
      border-collapse: collapse;
      width: 100%;
      font-size: 13px;
    }

    table.season th,
    table.season td {
      padding: 9px 12px;
      text-align: center;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }

    table.season th {
      background: var(--bg-elevated);
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 11px;
    }

    table.season td.player-name {
      text-align: left;
      font-weight: 700;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 15px;
      background: var(--card);
      position: sticky;
      left: 0;
    }

    table.season th.player-col {
      text-align: left;
      position: sticky;
      left: 0;
      background: var(--bg-elevated);
    }

    table.season td.total {
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      background: var(--card);
    }

    .empty-state {
      color: var(--muted);
      font-size: 14px;
      padding: 30px 10px;
      text-align: center;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
    }

    .error-box {
      background: var(--loss-soft);
      border: 1px solid var(--loss);
      color: var(--text);
      border-radius: var(--radius);
      padding: 16px;
      font-size: 14px;
    }

    .status-line {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 14px;
    }
    .chart-box {
      position: relative;
      background: var(--bg-elevated);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 16px;
    }

    .chart-box h3 {
      margin: 0 0 4px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .chart-box .chart-hint {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .chart-svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .chart-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 7px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 11px;
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    .legend-item.off {
      opacity: 0.35;
    }

    .legend-item .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .legend-item .lv {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--muted);
    }
    .chart-tip {
      position: absolute;
      display: none;
      pointer-events: none;
      z-index: 5;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 12px;
      white-space: nowrap;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
    }

    .chart-tip .tn {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.03em;
    }

    .chart-tip .ts {
      color: var(--muted);
      font-size: 11px;
    }

    .chart-tip .tv {
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      font-size: 14px;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div id="app">Lädt…</div>

  <script>
    const DATA_URL = './data.json';
    const STAKE = 2;
    const BASE_ORDER = ['Tino', 'Spani', 'Muc', 'Julian', 'Malte', 'Markus', 'Michi', 'Thomas'];
    const BET_TYPES = {
      '1x2': '1X2',
      dc: 'Doppelte Chance',
      ou: 'Über/Unter',
      btts: 'Beide treffen',
      hc: 'Handicap',
      htft: 'HZ/Endstand',
      wuo: 'Wer gewinnt & Ü/U',
      free: 'Freitext'
    };
    const SEASON_BET_TYPES = {
      meister: 'Deutscher Meister',
      top4: 'Top 4',
      top6: 'Top 6',
      top10: 'Top 10',
      klassenerhalt: 'Klassenerhalt',
      abstieg: 'Absteiger',
      free: 'Freitext'
    };

    let state = null;
    let currentTab = 'matchday';
    let currentMdIndex = 0;

    function fmtEuro(value) {
      if (value === null || value === undefined) return '–';
      const sign = value > 0 ? '+' : '';
      return sign + value.toFixed(2).replace('.', ',') + ' €';
    }

    function el(tag, attrs, children) {
      const e = document.createElement(tag);
      if (attrs) {
        Object.keys(attrs).forEach(key => {
          if (attrs[key] === null || attrs[key] === undefined) return;
          if (key === 'class') e.className = attrs[key];
          else if (key.startsWith('on')) e.addEventListener(key.slice(2), attrs[key]);
          else e.setAttribute(key, attrs[key]);
        });
      }
      (children || []).forEach(child => {
        if (child == null) return;
        e.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
      });
      return e;
    }

    function computeResult(game) {
      const b = game.bet || {};
      const s = game.score || {};

      if (b.voided) return 'void';
      if (b.type === 'free') return b.manualResult || null;
      if (s.home === null || s.away === null || s.home === undefined || s.away === undefined || s.home === '' || s.away === '') return null;

      const h = Number(s.home);
      const a = Number(s.away);
      if (!b.type || !b.selection) return null;

      if (b.type === '1x2') {
        const out = h > a ? 'Heim' : (h < a ? 'Auswärts' : 'Unentschieden');
        return b.selection === out ? 'win' : 'loss';
      }

      if (b.type === 'dc') {
        const out = h > a ? 'Heim' : (h < a ? 'Auswärts' : 'Unentschieden');
        const map = {
          '1X': ['Heim', 'Unentschieden'],
          '12': ['Heim', 'Auswärts'],
          'X2': ['Unentschieden', 'Auswärts']
        };
        return (map[b.selection] || []).includes(out) ? 'win' : 'loss';
      }

      if (b.type === 'ou') {
        const total = h + a;
        const line = Number(b.line);
        if (total === line) return null;
        if (b.selection === 'Über') return total > line ? 'win' : 'loss';
        if (b.selection === 'Unter') return total < line ? 'win' : 'loss';
        return null;
      }

      if (b.type === 'btts') {
        const both = h > 0 && a > 0;
        return (b.selection === 'Ja') === both ? 'win' : 'loss';
      }

      if (b.type === 'hc') {
        const val = Number(b.hcValue);
        let adjH = h, adjA = a;
        if (b.hcTeam === 'Auswärts') adjA += val; else adjH += val; // bei "Unentschieden" gilt das Handicap für Heim
        const out = adjH > adjA ? 'Heim' : (adjH < adjA ? 'Auswärts' : 'Unentschieden');
        return out === b.hcTeam ? 'win' : 'loss';
      }

      if (b.type === 'htft') {
        if (s.htHome === null || s.htAway === null || s.htHome === undefined || s.htAway === undefined || s.htHome === '' || s.htAway === '') return null;
        const hh = Number(s.htHome), ha = Number(s.htAway);
        const htOut = hh > ha ? 'Heim' : (hh < ha ? 'Auswärts' : 'X');
        const ftOut = h > a ? 'Heim' : (h < a ? 'Auswärts' : 'X');
        return b.selection === (htOut + '/' + ftOut) ? 'win' : 'loss';
      }

      if (b.type === 'wuo') {
        const out = h > a ? 'Heim' : (h < a ? 'Auswärts' : 'Unentschieden');
        const total = h + a;
        const line = Number(b.line);
        if (total === line) return null;
        if (!b.ouSelection) return null;
        const totalWin = b.ouSelection === 'Über' ? total > line : total < line;
        const outcomeWin = b.selection === out;
        return (outcomeWin && totalWin) ? 'win' : 'loss';
      }

      return null;
    }

    function gameProfit(game) {
      const result = computeResult(game);
      if (result === 'void') return 0;
      if (result === 'win') {
        const q = Number(game.bet.quote);
        if (!q) return null;
        return Math.round((q * STAKE - STAKE) * 100) / 100;
      }
      if (result === 'loss') return game.rank === 1 ? 0 : -STAKE;
      return null;
    }

    function matchdayTotals(matchday) {
      const totals = {};
      BASE_ORDER.forEach(player => totals[player] = 0);
      let allDone = true;
      matchday.games.forEach(game => {
        const profit = gameProfit(game);
        if (profit === null) allDone = false;
        else totals[game.player] += profit;
      });
      return { totals, allDone };
    }

    function seasonBetProfit(bet) {
      if (!bet) return null;
      if (bet.voided) return 0;
      if (!bet.manualResult) return null;
      if (bet.manualResult === 'win') {
        const q = Number(bet.quote);
        if (!q) return null;
        return Math.round((q * STAKE - STAKE) * 100) / 100;
      }
      if (bet.manualResult === 'loss') return -STAKE;
      return null;
    }

    function seasonTotals() {
      const totals = {};
      const perMd = [];
      BASE_ORDER.forEach(player => totals[player] = 0);

      state.matchdays.forEach(matchday => {
        const current = matchdayTotals(matchday).totals;
        perMd.push(current);
        BASE_ORDER.forEach(player => totals[player] += current[player]);
      });

      const sb = {};
      BASE_ORDER.forEach(player => {
        sb[player] = seasonBetProfit(state.seasonBets && state.seasonBets[player]);
        if (sb[player] !== null) totals[player] += sb[player];
      });

      return { totals, perMd, sb };
    }

    function betDescription(game) {
      const b = game.bet || {};
      if (!b.type) return 'Noch keine Wette eingetragen';
      const label = BET_TYPES[b.type] || b.type;
      if (b.type === 'free') return (b.freitext || '—') + ' · ' + label;
      if (b.type === 'ou') return label + ' ' + b.line + ' · ' + (b.selection || '—');
      if (b.type === 'hc') return label + ' · ' + (b.hcTeam || '—') + ' ' + b.hcValue;
      if (b.type === 'wuo') return label + ' · ' + (b.selection || '—') + ' & ' + (b.ouSelection || '—') + ' ' + b.line;
      return label + ' · ' + (b.selection || '—');
    }

    function fmtScoreVal(v) {
      return (v === null || v === undefined || v === '') ? '–' : String(v);
    }

    function renderHeader() {
      const wrap = el('div', { class: 'scoreboard' });
      wrap.appendChild(el('div', {}, [
        el('h1', {}, ['Tipprunde']),
        el('div', { class: 'sub' }, ['Live-Übersicht · nur Lesen'])
      ]));

      const tabs = el('div', { class: 'tabs' }, [
        el('button', { class: 'tab' + (currentTab === 'matchday' ? ' active' : ''), onclick: () => { currentTab = 'matchday'; render(); } }, ['Spieltag']),
        el('button', { class: 'tab' + (currentTab === 'seasonbets' ? ' active' : ''), onclick: () => { currentTab = 'seasonbets'; render(); } }, ['Saisonwetten']),
        el('button', { class: 'tab' + (currentTab === 'season' ? ' active' : ''), onclick: () => { currentTab = 'season'; render(); } }, ['Saison'])
      ]);
      wrap.appendChild(tabs);
      return wrap;
    }

    function renderGame(game) {
      const card = el('div', { class: 'game' });
      const head = el('div', { class: 'game-head' }, [
        el('span', { class: 'rank-badge' }, ['#' + game.rank]),
        game.rank === 1 ? el('span', { class: 'rank-badge', style: 'color:var(--accent);border-color:var(--accent-soft);' }, ['Bonus · kostenlos']) : null,
        el('div', { class: 'teams' }, [
          el('span', {}, [game.home || '?']),
          el('span', { class: 'vs' }, ['–']),
          el('span', {}, [game.away || '?'])
        ]),
        el('span', { class: 'player-chip' }, [game.player])
      ]);
      card.appendChild(head);

      const body = el('div', { class: 'game-body' });
      const left = el('div', {});
      left.appendChild(el('div', { class: 'bet-desc' }, [betDescription(game)]));
      if (game.bet && game.bet.type && game.bet.quote) {
        left.appendChild(el('div', { class: 'bet-desc' }, ['Quote: ', el('b', {}, [String(game.bet.quote)])]));
      }
      body.appendChild(left);

      const score = game.score || {};
      const scoreBox = el('div', {}, [
        el('div', { class: 'score-disp' }, [fmtScoreVal(score.home) + ' : ' + fmtScoreVal(score.away)])
      ]);
      if (game.bet && game.bet.type === 'htft') {
        scoreBox.appendChild(el('div', { class: 'bet-desc' }, ['HZ ' + fmtScoreVal(score.htHome) + ' : ' + fmtScoreVal(score.htAway)]));
      }
      body.appendChild(scoreBox);

      const result = computeResult(game);
      const profit = gameProfit(game);
      let pillClass = 'result-pending';
      let label = 'Offen';

      if (result === 'win') {
        pillClass = 'result-win';
        label = 'Gewonnen · ' + fmtEuro(profit);
      } else if (result === 'loss') {
        pillClass = 'result-loss';
        label = 'Verloren · ' + fmtEuro(profit);
      } else if (result === 'void') {
        pillClass = 'result-voided';
        label = 'Annulliert · ' + fmtEuro(profit);
      }

      body.appendChild(el('div', { class: 'result-pill ' + pillClass }, [label]));
      card.appendChild(body);
      return card;
    }

    function renderMatchdaySummary(matchday) {
      const { totals, allDone } = matchdayTotals(matchday);
      const box = el('div', { class: 'summary' });
      box.appendChild(el('h3', {}, ['Spieltag ' + matchday.nr + (allDone ? ' · abgeschlossen' : ' · läuft noch')]));
      const grid = el('div', { class: 'summary-grid' });
      BASE_ORDER.forEach(player => {
        const value = totals[player];
        const cls = value > 0 ? 'pos' : (value < 0 ? 'neg' : 'zero');
        grid.appendChild(el('div', { class: 'summary-item' }, [
          el('div', { class: 'name' }, [player]),
          el('div', { class: 'val ' + cls }, [fmtEuro(value)])
        ]));
      });
      box.appendChild(grid);
      return box;
    }

    function renderMatchdayView() {
      const wrap = el('div', {});
      const matchday = state.matchdays[currentMdIndex];
      const nav = el('div', { class: 'md-nav' });
      nav.appendChild(el('div', { class: 'md-badge' }, [String(matchday.nr)]));

      const select = el('select', {
        onchange: (e) => {
          currentMdIndex = Number(e.target.value);
          render();
        }
      });

      state.matchdays.forEach((md, index) => {
        select.appendChild(el('option', { value: index, ...(index === currentMdIndex ? { selected: 'selected' } : {}) }, ['Spieltag ' + md.nr + (md.closed ? ' ✓' : '')]));
      });
      nav.appendChild(select);
      wrap.appendChild(nav);

      matchday.games.forEach(game => wrap.appendChild(renderGame(game)));
      wrap.appendChild(renderMatchdaySummary(matchday));
      return wrap;
    }

    function renderSeasonBetsView() {
      const wrap = el('div', {});
      wrap.appendChild(el('div', { class: 'status-line' }, ['Saisonwette Bundesliga ' + (state.seasonYear || 2026) + '/' + String((state.seasonYear || 2026) + 1).slice(2) + ' – ein Tipp pro Mitspieler.']));

      BASE_ORDER.forEach(player => {
        const bet = state.seasonBets && state.seasonBets[player] ? state.seasonBets[player] : {};
        const card = el('div', { class: 'game' });
        card.appendChild(el('div', { class: 'game-head' }, [el('span', { class: 'player-chip' }, [player])]));

        const body = el('div', { class: 'game-body' });
        const label = bet.type ? (SEASON_BET_TYPES[bet.type] || bet.type) : 'Noch keine Wette';
        const detail = bet.type === 'free' ? (bet.freitext || '—') : (bet.team || '—');
        body.appendChild(el('div', { class: 'bet-desc' }, [bet.type ? (detail + ' · ' + label + (bet.quote ? (' · Quote ' + bet.quote) : '')) : label]));

        const profit = seasonBetProfit(bet);
        let pillClass = 'result-pending';
        let resLabel = 'Offen';

        if (bet.voided) {
          pillClass = 'result-voided';
          resLabel = 'Annulliert · ' + fmtEuro(profit);
        } else if (bet.manualResult === 'win') {
          pillClass = 'result-win';
          resLabel = 'Gewonnen · ' + fmtEuro(profit);
        } else if (bet.manualResult === 'loss') {
          pillClass = 'result-loss';
          resLabel = 'Verloren · ' + fmtEuro(profit);
        }

        body.appendChild(el('div', { class: 'result-pill ' + pillClass }, [resLabel]));
        card.appendChild(body);
        wrap.appendChild(card);
      });

      return wrap;
    }

    const PLAYER_COLORS = {
      Tino: '#FFB238',
      Spani: '#3FA35A',
      Muc: '#4DA3FF',
      Julian: '#E4572E',
      Malte: '#B57BFF',
      Markus: '#2EC4B6',
      Michi: '#FF6FA5',
      Thomas: '#C9D26B'
    };
    const hiddenPlayers = new Set();

    function svgEl(tag, attrs, text) {
      const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
      Object.keys(attrs || {}).forEach(k => e.setAttribute(k, attrs[k]));
      if (text != null) e.textContent = text;
      return e;
    }

    function niceStep(range, targetTicks) {
      const raw = range / targetTicks;
      const pow = Math.pow(10, Math.floor(Math.log10(raw)));
      const f = raw / pow;
      const nf = f <= 1 ? 1 : (f <= 2 ? 2 : (f <= 5 ? 5 : 10));
      return nf * pow;
    }

    function fmtAxis(v, step) {
      const txt = (step < 1 ? v.toFixed(2) : String(Math.round(v))).replace('.', ',');
      return txt + ' €';
    }

    function showChartTip(box, tip, target, color, player, mdNr, value) {
      tip.innerHTML = '';
      tip.appendChild(el('div', { class: 'tn', style: 'color:' + color }, [player]));
      tip.appendChild(el('div', { class: 'ts' }, ['nach Spieltag ' + mdNr]));
      tip.appendChild(el('div', { class: 'tv ' + (value > 0 ? 'pos' : (value < 0 ? 'neg' : 'zero')) }, [fmtEuro(value)]));
      tip.style.display = 'block';
      const b = box.getBoundingClientRect();
      const r = target.getBoundingClientRect();
      const cx = r.left + r.width / 2 - b.left;
      const cy = r.top + r.height / 2 - b.top;
      const tw = tip.offsetWidth, th = tip.offsetHeight;
      let left = cx - tw / 2;
      left = Math.max(4, Math.min(left, b.width - tw - 4));
      let top = cy - th - 14;
      if (top < 4) top = cy + 14;
      tip.style.left = left + 'px';
      tip.style.top = top + 'px';
    }

    function renderSeasonChart(perMd) {
      const box = el('div', { class: 'chart-box' });
      box.appendChild(el('h3', {}, ['Verlauf der Gesamtsumme']));
      box.appendChild(el('div', { class: 'chart-hint' }, ['Kumulierter Stand je Spieltag (ohne Saisonwetten). Namen unten antippen, um Spieler ein-/auszublenden.']));

      const n = perMd.length;
      const series = {};
      BASE_ORDER.forEach(player => {
        let sum = 0;
        const pts = [0];
        perMd.forEach(t => {
          sum += t[player];
          pts.push(Math.round(sum * 100) / 100);
        });
        series[player] = pts;
      });

      let visible = BASE_ORDER.filter(p => !hiddenPlayers.has(p));
      const scaleSet = visible.length ? visible : BASE_ORDER;
      let min = 0, max = 0;
      scaleSet.forEach(p => series[p].forEach(v => { if (v < min) min = v; if (v > max) max = v; }));
      if (max - min < 1) max = min + 1;
      const step = niceStep(max - min, 5);
      const yMin = Math.floor(min / step) * step;
      const yMax = Math.ceil(max / step) * step;

      const W = 720, H = 360, ml = 62, mr = 16, mt = 14, mb = 30;
      const xAt = i => ml + (n === 0 ? 0 : i * (W - ml - mr) / n);
      const yAt = v => mt + (yMax - v) * (H - mt - mb) / (yMax - yMin);

      const svg = svgEl('svg', { class: 'chart-svg', viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': 'Verlauf der Gesamtsumme pro Spieltag' });

      for (let v = yMin; v <= yMax + step / 2; v += step) {
        const y = yAt(v);
        const isZero = Math.abs(v) < step / 1000;
        svg.appendChild(svgEl('line', { x1: ml, x2: W - mr, y1: y, y2: y, stroke: isZero ? '#586570' : '#2A343B', 'stroke-width': isZero ? 1.5 : 1 }));
        svg.appendChild(svgEl('text', { x: ml - 8, y: y + 4, 'text-anchor': 'end', fill: '#8B9AA3', 'font-size': 11, 'font-family': 'Space Mono, monospace' }, fmtAxis(isZero ? 0 : v, step)));
      }

      const every = Math.max(1, Math.ceil(n / 17));
      for (let i = 1; i <= n; i++) {
        if (i % every !== 0 && i !== n && i !== 1) continue;
        svg.appendChild(svgEl('text', { x: xAt(i), y: H - 9, 'text-anchor': 'middle', fill: '#8B9AA3', 'font-size': 11, 'font-family': 'Space Mono, monospace' }, 'ST ' + state.matchdays[i - 1].nr));
      }

      const tip = el('div', { class: 'chart-tip' });
      document.addEventListener('click', () => { tip.style.display = 'none'; });

      visible.forEach(player => {
        const color = PLAYER_COLORS[player] || '#EEF1F0';
        const pts = series[player];
        const path = pts.map((v, i) => (i === 0 ? 'M' : 'L') + xAt(i).toFixed(1) + ' ' + yAt(v).toFixed(1)).join(' ');
        svg.appendChild(svgEl('path', { d: path, fill: 'none', stroke: color, 'stroke-width': 2.5, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
        pts.forEach((v, i) => {
          if (i === 0) return;
          const cx = xAt(i), cy = yAt(v);
          svg.appendChild(svgEl('circle', { cx, cy, r: i === n ? 4.5 : 3, fill: color, stroke: '#151B1F', 'stroke-width': 1.5, 'pointer-events': 'none' }));
          const hit = svgEl('circle', { cx, cy, r: 11, fill: 'transparent', style: 'cursor:pointer;' });
          const show = () => showChartTip(box, tip, hit, color, player, state.matchdays[i - 1].nr, v);
          hit.addEventListener('pointerenter', show);
          hit.addEventListener('pointermove', show);
          hit.addEventListener('pointerleave', () => { tip.style.display = 'none'; });
          hit.addEventListener('click', (ev) => { ev.stopPropagation(); show(); });
          svg.appendChild(hit);
        });
      });

      box.appendChild(svg);
      box.appendChild(tip);

      const legend = el('div', { class: 'chart-legend' });
      BASE_ORDER.slice().sort((a, b) => series[b][n] - series[a][n]).forEach(player => {
        const off = hiddenPlayers.has(player);
        legend.appendChild(el('button', {
          class: 'legend-item' + (off ? ' off' : ''),
          onclick: () => {
            if (hiddenPlayers.has(player)) hiddenPlayers.delete(player); else hiddenPlayers.add(player);
            const y = window.scrollY;
            render();
            window.scrollTo(0, y);
          }
        }, [
          el('span', { class: 'dot', style: 'background:' + (PLAYER_COLORS[player] || '#EEF1F0') }),
          el('span', {}, [player]),
          el('span', { class: 'lv' }, [fmtEuro(series[player][n])])
        ]));
      });
      box.appendChild(legend);
      return box;
    }

    function renderSeasonView() {
      const wrap = el('div', {});
      if (!state.matchdays.length) {
        wrap.appendChild(el('div', { class: 'empty-state' }, ['Noch keine Spieltage.']));
        return wrap;
      }

      const { totals, perMd, sb } = seasonTotals();
      const ranked = BASE_ORDER.slice().sort((a, b) => totals[b] - totals[a]);
      wrap.appendChild(renderSeasonChart(perMd));
      const tableWrap = el('div', { class: 'table-wrap' });
      const table = el('table', { class: 'season' });

      const headRow = el('tr', {}, [el('th', { class: 'player-col' }, ['Spieler'])]);
      state.matchdays.forEach(md => headRow.appendChild(el('th', {}, ['ST ' + md.nr])));
      headRow.appendChild(el('th', {}, ['Saisonwette']));
      headRow.appendChild(el('th', {}, ['Gesamt']));
      table.appendChild(el('thead', {}, [headRow]));

      const tbody = el('tbody', {});
      ranked.forEach(player => {
        const row = el('tr', {}, [el('td', { class: 'player-name' }, [player])]);
        perMd.forEach(mdTotals => {
          const value = mdTotals[player];
          const cls = value > 0 ? 'pos' : (value < 0 ? 'neg' : 'zero');
          row.appendChild(el('td', { class: cls }, [fmtEuro(value)]));
        });

        const seasonVal = sb[player];
        const sbCls = seasonVal == null ? '' : (seasonVal > 0 ? 'pos' : (seasonVal < 0 ? 'neg' : 'zero'));
        row.appendChild(el('td', { class: sbCls }, [seasonVal == null ? '–' : fmtEuro(seasonVal)]));

        const tv = totals[player];
        const tcls = tv > 0 ? 'pos' : (tv < 0 ? 'neg' : 'zero');
        row.appendChild(el('td', { class: 'total ' + tcls }, [fmtEuro(tv)]));
        tbody.appendChild(row);
      });

      table.appendChild(tbody);
      tableWrap.appendChild(table);
      wrap.appendChild(tableWrap);
      return wrap;
    }

    function render() {
      const app = document.getElementById('app');
      app.innerHTML = '';
      app.appendChild(renderHeader());
      if (currentTab === 'matchday') app.appendChild(renderMatchdayView());
      else if (currentTab === 'seasonbets') app.appendChild(renderSeasonBetsView());
      else app.appendChild(renderSeasonView());
    }

    async function loadData() {
      const app = document.getElementById('app');
      app.textContent = 'Lädt…';

      try {
        const response = await fetch(DATA_URL + '?t=' + Date.now(), { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);

        const data = await response.json();
        if (!data || !Array.isArray(data.matchdays)) {
          throw new Error('Ungültiges Datenformat');
        }

        state = data;
        currentMdIndex = Math.max(0, state.matchdays.length - 1);
        render();
      } catch (error) {
        console.error('Viewer konnte nicht geladen werden:', error);
        app.innerHTML = '';
        app.appendChild(el('div', { class: 'error-box' }, ['Konnte data.json nicht laden. (' + error.message + ')']));
      }
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('service worker registered'))
        .catch(err => console.error('register service worker failed:', err));
    }

    loadData();
  </script>
</body>
